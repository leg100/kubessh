apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kubessh.fullname" . }}-test-connection"
  labels:
    {{- include "kubessh.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: nc
      image: busybox
      command: ['sh', '-c']
      args: ['nc -zv {{ include "kubessh.fullname" . }} {{ .Values.service.port }} && echo "SSH port is open" || exit 1']
  restartPolicy: Never
